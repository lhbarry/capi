# Flux job: provision CAPA EKS clusters from git.
# Path: ./aws_eks/clusters → Kind → CAPA → AWS EKS
# Active: push to main implements (creates/updates AWS EKS). Costs money.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aws-eks-clusters
  namespace: flux-system
  labels:
    capa.lab/job: aws-eks-clusters
    capa.lab/path: aws-eks
spec:
  interval: 1m0s
  retryInterval: 30s
  timeout: 10m0s
  suspend: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./aws_eks/clusters
  prune: true
  wait: false
