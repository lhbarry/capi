# Flux job: provision CAPA EKS clusters from git.
# Path: ./aws_eks/clusters → Kind → CAPA → AWS EKS
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aws-eks-clusters
  namespace: flux-system
  labels:
    capa.lab/job: aws-eks-clusters
    capa.lab/path: aws-eks
spec:
  interval: 1m0s
  retryInterval: 30s
  timeout: 10m0s
  # Empty resources in aws_eks/clusters; leave unsuspended so prune runs on push.
  suspend: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./aws_eks/clusters
  prune: true
  wait: false
