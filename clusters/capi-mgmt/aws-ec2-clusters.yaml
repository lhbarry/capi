# Flux applies CAPA/CAPI workload objects from git → Kind → CAPA reconciles to AWS.
# Source reuses the bootstrap GitRepository (same private repo).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aws-ec2-clusters
  namespace: flux-system
spec:
  interval: 1m0s
  retryInterval: 30s
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./aws_ec2/clusters
  prune: true
  wait: false
