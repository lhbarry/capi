---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  annotations:
    metadata.weave.works/description: This is the source location for the Weave GitOps Dashboard's helm chart.
  labels:
    app.kubernetes.io/component: ui
    app.kubernetes.io/created-by: weave-gitops-cli
    app.kubernetes.io/name: weave-gitops-dashboard
    app.kubernetes.io/part-of: weave-gitops
  name: ww-gitops
  namespace: flux-system
spec:
  interval: 1h0m0s
  type: oci
  url: oci://ghcr.io/weaveworks/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  annotations:
    metadata.weave.works/description: Weave GitOps Dashboard for Flux visibility.
  name: ww-gitops
  namespace: flux-system
spec:
  interval: 1h0m0s
  # CD DISABLED with rest of Flux pure-dev posture
  suspend: true
  chart:
    spec:
      chart: weave-gitops
      sourceRef:
        kind: HelmRepository
        name: ww-gitops
  values:
    adminUser:
      create: true
      username: admin
      # bcrypt for placeholder password "changeme" — rotate for real use
      passwordHash: $2a$10$WG92IM4hd7HCwi208A/jKuWEm6hJOZW.SdAx2yHrLNohgx8KTkrfO
