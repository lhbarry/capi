# Flux bootstrap sync for this repo.
# CD DISABLED (pure-dev / design phase): GitRepository + root Kustomization suspended.
# Resume only when intentionally promoting from git to a live management cluster.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m0s
  suspend: true
  ref:
    branch: main
  secretRef:
    name: flux-system
  url: https://github.com/lhbarry/capi.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m0s
  suspend: true
  path: ./clusters/capi-mgmt
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
