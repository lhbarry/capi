  <text x="426" y="804" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e1b4b">OpenTelemetry · Collector / OTLP</text>

  <rect x="724" y="746" width="300" height="78" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
