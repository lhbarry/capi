  <rect x="96" y="204" width="120" height="36" rx="6" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="156" y="226" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e3a8a">Flux + CAPI/CAPA</text>
  <rect x="228" y="204" width="350" height="36" rx="6" fill="#d1fae5" stroke="#34d399"/>
