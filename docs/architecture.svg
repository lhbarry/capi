  <text x="540" y="518" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#e11d48">↔</text>

  <rect x="580" y="490" width="440" height="48" rx="8" fill="#fff1f2" stroke="#fda4af"/>
  <text x="596" y="510" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#9f1239">Argo CD Agent</text>
  <text x="596" y="528" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Spoke · on EKS · reconciles services + apps</text>

  <line x1="800" y1="538" x2="800" y2="562" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow-violet)"/>
