  <text x="560" y="376" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#065f46">EKS control plane</text>
  <text x="560" y="392" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Managed API / etcd · HA by AWS</text>

  <rect x="724" y="358" width="300" height="44" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="874" y="376" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#065f46">Workers (CAPA)</text>
  <text x="874" y="392" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#334155">EC2 · AL2023 · lab sizing</text>

  <!-- ========== CI/CD band (Argo) ========== -->
  <line x1="560" y1="420" x2="560" y2="444" stroke="#e11d48" stroke-width="2.5" marker-end="url(#arrow-rose)"/>
