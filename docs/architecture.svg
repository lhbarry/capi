  <!-- Flow notes -->
  <rect x="96" y="842" width="928" height="72" rx="8" fill="#faf5ff" stroke="#ddd6fe"/>
  <text x="560" y="866" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5b21b6">Git → Argo CD Principal ↔ Agent → EKS services/apps · CI → Harbor · Keycloak → OAuth2 Proxy → UIs</text>
  <text x="560" y="886" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5b21b6">Apps → CNPG · OTel Collector → Mimir / Loki / Tempo → Grafana</text>
  <text x="560" y="904" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Flux ≠ Argo: Flux bootstraps the cluster via CAPA; Argo delivers everything that runs on EKS</text>

  <rect x="96" y="928" width="928" height="90" rx="8" fill="#fff1f2" stroke="#fecdd3"/>
  <text x="112" y="952" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#9f1239">GitOps split</text>
  <text x="112" y="974" font-family="system-ui, sans-serif" font-size="11" fill="#334155">Flux on Kind → CAPA CRs → EKS lifecycle (create/update/delete cluster)</text>
  <text x="112" y="994" font-family="system-ui, sans-serif" font-size="11" fill="#334155">Argo CD Principal (hub) + Agent (on EKS) → services plane + application workloads</text>
  <text x="112" y="1014" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">See ARCHITECTURE.md §7 · Principal placement may be isolated in production; Agent always on spoke</text>

  <!-- Footer -->
  <text x="560" y="1075" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Primary: aws_eks · Services + CD catalog in ARCHITECTURE.md §7 · aws_ec2 secondary</text>
