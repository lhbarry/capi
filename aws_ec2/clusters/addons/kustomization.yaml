# Apply to the WORKLOAD cluster (not Kind):
#   clusterctl get kubeconfig capi-lab-1 -n default > /tmp/capi-lab-1.kubeconfig
#   kubectl --kubeconfig=/tmp/capi-lab-1.kubeconfig apply -k aws_ec2/clusters/addons
#
# Do not add this directory to the Flux path that targets Kind (clusters/capi-mgmt
# aws-ec2-clusters → ./aws_ec2/clusters only includes CAPI objects via parent kustomization).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - calico-v3.29.3.yaml
  - aws-cloud-controller-manager-ds.yaml
