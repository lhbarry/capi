AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Monthly cost budget + optional email alarms for SCKE production platform.
  Template only until deployed; not applied by Flux.

Parameters:
  MonthlyBudgetAmount:
    Type: Number
    Default: 500
    MinValue: 1
    Description: Monthly USD budget (tune to Reserved 3/5/5 + bootstrap + headroom floor).
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional email for budget notifications. Empty = budget only, no subscribers.
  BudgetName:
    Type: String
    Default: scke-production-monthly

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Resources:
  LabMonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Ref BudgetName
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetAmount
          Unit: USD
        CostTypes:
          IncludeCredit: false
          IncludeDiscount: true
          IncludeOtherSubscription: true
          IncludeRecurring: true
          IncludeRefund: false
          IncludeSubscription: true
          IncludeSupport: true
          IncludeTax: true
          IncludeUpfront: true
          UseAmortized: false
          UseBlended: false
      NotificationsWithSubscribers: !If
        - HasAlertEmail
        - - Notification:
              NotificationType: ACTUAL
              ComparisonOperator: GREATER_THAN
              Threshold: 80
              ThresholdType: PERCENTAGE
            Subscribers:
              - SubscriptionType: EMAIL
                Address: !Ref AlertEmail
          - Notification:
              NotificationType: ACTUAL
              ComparisonOperator: GREATER_THAN
              Threshold: 100
              ThresholdType: PERCENTAGE
            Subscribers:
              - SubscriptionType: EMAIL
                Address: !Ref AlertEmail
          - Notification:
              NotificationType: FORECASTED
              ComparisonOperator: GREATER_THAN
              Threshold: 100
              ThresholdType: PERCENTAGE
            Subscribers:
              - SubscriptionType: EMAIL
                Address: !Ref AlertEmail
        - !Ref AWS::NoValue

Outputs:
  BudgetName:
    Description: AWS Budgets name
    Value: !Ref BudgetName
  MonthlyLimitUSD:
    Value: !Ref MonthlyBudgetAmount
