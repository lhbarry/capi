# OpenTelemetry Collector Gateway — Services cluster (diagram: OpenTelemetry)
# Receives OTLP from Workload + local; exports metrics→Mimir, logs→Loki, traces→Tempo.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-gateway-config-sketch
  namespace: observability
  labels:
    scke.io/observability: lgtm
    scke.io/architecture-component: opentelemetry
data:
  relay.yaml: |
    # Illustrative OTel Collector config — install via OTel Operator / Helm at deploy time
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      # EKS CP logs: AWS rail CloudWatch (CP Logs Only) is the only first hop.
      # OTel contrib receiver CAN collect them from CW log groups → Loki.
      # Requires IRSA: logs:DescribeLogGroups, logs:FilterLogEvents, …
      awscloudwatchlogs/services:
        region: us-east-2
        log_group_name: /aws/eks/capi-eks-services/cluster
      awscloudwatchlogs/workload:
        region: us-east-2
        log_group_name: /aws/eks/capi-eks-workload/cluster
    processors:
      batch: {}
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
    exporters:
      prometheusremotewrite:
        endpoint: http://mimir-nginx.observability.svc:80/api/v1/push
      loki:
        endpoint: http://loki-gateway.observability.svc:80/loki/api/v1/push
      otlp/tempo:
        endpoint: tempo-distributor.observability.svc:4317
        tls:
          insecure: true
    service:
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheusremotewrite]
        logs:
          receivers: [otlp, awscloudwatchlogs/services, awscloudwatchlogs/workload]
          processors: [memory_limiter, batch]
          exporters: [loki]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/tempo]
