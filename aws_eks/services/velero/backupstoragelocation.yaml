# Template — set bucket/region; apply on each cluster after Velero install
apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: default
  namespace: velero
spec:
  provider: aws
  objectStorage:
    bucket: scke-velero-backups
    prefix: cluster-name   # use services | workload
  config:
    region: us-east-2
  default: true
---
apiVersion: velero.io/v1
kind: VolumeSnapshotLocation
metadata:
  name: default
  namespace: velero
spec:
  provider: aws
  config:
    region: us-east-2
