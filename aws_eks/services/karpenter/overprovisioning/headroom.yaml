# Keep ≥ 1.5 × one worker node (t3.large) CPU + RAM available and waiting.
# 1.5 × (2 vCPU, 8 GiB) = 3 vCPU, 12 GiB — preemptible via low PriorityClass.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headroom-overprovision
  namespace: kube-system
  labels:
    capacity.scke.io/reservation: elastic
    capacity.scke.io/component: headroom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headroom-overprovision
  template:
    metadata:
      labels:
        app: headroom-overprovision
        capacity.scke.io/reservation: elastic
        capacity.scke.io/component: headroom
    spec:
      priorityClassName: scke-overprovisioning
      terminationGracePeriodSeconds: 0
      # Prefer elastic/shared nodes (no plane taint required).
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: capacity.scke.io/reservation
                    operator: In
                    values: ["elastic"]
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: "3"
              memory: 12Gi
            limits:
              cpu: "3"
              memory: 12Gi
