# Default EC2NodeClass template — set discovery tag to the target cluster name.
# Services: karpenter.sh/discovery: capi-eks-services
# Workload: karpenter.sh/discovery: capi-eks-workload
#
# Prefer copying this file per cluster or overlay via kustomize/Helm at install.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
  labels:
    capa.scke/path: aws-eks
    capacity.scke.io/component: karpenter
spec:
  role: nodes.cluster-api-provider-aws.sigs.k8s.io
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        # REPLACE per cluster: capi-eks-services | capi-eks-workload
        karpenter.sh/discovery: PLACEHOLDER_CLUSTER_NAME
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: PLACEHOLDER_CLUSTER_NAME
  tags:
    Project: scke
    Environment: production
    ManagedBy: karpenter
    CostCenter: scke
    Phase: production-design
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required
