apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: services
  labels:
    capa.scke/path: aws-eks
    capacity.scke.io/plane: services
spec:
  role: nodes.cluster-api-provider-aws.sigs.k8s.io
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: capi-eks-services
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: capi-eks-services
  tags:
    Project: scke
    Environment: production
    Workload: capi-eks-services
    ManagedBy: karpenter
    CostCenter: scke
    capacity.scke.io/plane: services
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required
