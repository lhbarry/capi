# Overlay: ApplicationController ON; ApplicationSetController OFF (see principal values).

controller:
  # Required on Principal/Services — not ApplicationSetController
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  nodeSelector:
    capacity.scke.io/plane: services
  tolerations:
    - key: capacity.scke.io/plane
      operator: Equal
      value: services
      effect: NoSchedule

# Explicit: ApplicationSet controller disabled (also set in principal values)
applicationSet:
  enabled: false

# Workload Applications: Agent on Workload cluster only (never co-locate Agent here).
