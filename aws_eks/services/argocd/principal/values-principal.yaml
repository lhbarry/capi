# Argo CD Helm values — Principal (Services cluster)
# Chart: argo/argo-cd (appVersion ~ v3.4.5). Merge with application-controller values.

fullname: argocd

# Services-plane placement (Karpenter Reserved services taint)
global:
  domain: argocd.services.example.com
  nodeSelector:
    capacity.scke.io/plane: services
  tolerations:
    - key: capacity.scke.io/plane
      operator: Equal
      value: services
      effect: NoSchedule

# HA later: increase replicas / enable redis-ha
server:
  replicas: 2
  service:
    type: ClusterIP
  # UI exposed via OAuth2 Proxy / Ingress (not LoadBalancer public by default)

repoServer:
  replicas: 2

redis-ha:
  enabled: false
  # enable for production HA when ready

configs:
  cm:
    # url: https://argocd.services.example.com
    # exec.enabled: "false"
    timeout.reconciliation: 180s
  params:
    # server.insecure: "true"  # only behind TLS-terminating proxy
    application.namespaces: "argocd"

# Dex / OIDC → Keycloak later
# configs.cm.oidc.config: |

# Agent Principal (argocd-agent) is installed as a separate chart/manifests.
# See architecture.md and install.md.
