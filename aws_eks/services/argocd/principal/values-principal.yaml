# Argo CD Helm values — Principal (Services cluster only)
# Chart: argo/argo-cd (appVersion ~ v3.4.5). Merge with application-controller values.
#
# CONSTRAINTS:
# - Do NOT install Workload Agent on this cluster (Principal+Agent co-location unsupported).
# - ApplicationSetController OFF — Principal uses ApplicationController only.

fullname: argocd

global:
  domain: argocd.services.example.com
  nodeSelector:
    capacity.scke.io/plane: services
  tolerations:
    - key: capacity.scke.io/plane
      operator: Equal
      value: services
      effect: NoSchedule

server:
  replicas: 2
  service:
    type: ClusterIP

repoServer:
  replicas: 2

redis-ha:
  enabled: false

# ApplicationSetController: disabled (use ApplicationController for Services Applications)
applicationSet:
  enabled: false
  # replicas: 0

configs:
  cm:
    timeout.reconciliation: 180s
  params:
    application.namespaces: "argocd"

# ApplicationController: see ../application-controller/values-application-controller.yaml

# argocd-agent Principal (hub): separate install — not the Workload Agent.
# See architecture.md and install.md.
