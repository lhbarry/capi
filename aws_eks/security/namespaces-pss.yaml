# Pod Security Standards — restricted for app/platform namespaces (baseline on system).
# Apply to each EKS cluster; adjust exceptions carefully.
---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    capacity.scke.io/plane: services
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd-agent
  labels:
    capacity.scke.io/plane: workload
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: karpenter
  labels:
    capacity.scke.io/plane: workload
    # Karpenter may need baseline until charts support restricted fully
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: platform
  labels:
    capacity.scke.io/plane: services
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
