# CAPA EKS cluster definitions (Services + Workload).
# Management cluster is NOT here — see management/ (Rancher/RKE2).
#
# SAFETY: keep resources empty until intentional promotion.
# Provision order: Management → Services → Workload (docs/provisioning-order.md)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources: []
# When promoting:
#   resources:
#     - services/cluster.yaml
#     - workload/cluster.yaml

configMapGenerator:
  - name: capa-eks-cluster-params
    namespace: default
    literals:
      - AWS_REGION=us-east-2
    options:
      disableNameSuffixHash: true
      labels:
        capa.scke/params: eks

replacements:
  - source:
      kind: ConfigMap
      name: capa-eks-cluster-params
      fieldPath: data.AWS_REGION
    targets:
      - select:
          kind: AWSManagedControlPlane
        fieldPaths:
          - spec.region
