# Flux path ./aws_eks/clusters
# Parameterize via configMapGenerator + replacements (edit literals before enabling resources).
#
# SAFETY: keep resources: [] until intentional environment promotion.
# Enabling + push to a Flux-tracked branch creates real EKS (3 AZ production floor).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Re-add the cluster file when provisioning, e.g.:
#   resources: [capi-eks-1.yaml]
resources: []

configMapGenerator:
  - name: capa-eks-cluster-params
    namespace: default
    literals:
      # Set these for your environment before enabling resources and pushing.
      - AWS_REGION=us-east-2
      # Your public IP/32 (or office egress) for EKS public API allowlist.
      # Never leave as 0.0.0.0/0 in shared accounts.
      - PUBLIC_API_CIDR=YOUR_PUBLIC_IP/32
    options:
      disableNameSuffixHash: true
      labels:
        capa.lab/params: eks

replacements:
  - source:
      kind: ConfigMap
      name: capa-eks-cluster-params
      fieldPath: data.AWS_REGION
    targets:
      - select:
          kind: AWSManagedControlPlane
        fieldPaths:
          - spec.region
  - source:
      kind: ConfigMap
      name: capa-eks-cluster-params
      fieldPath: data.PUBLIC_API_CIDR
    targets:
      - select:
          kind: AWSManagedControlPlane
        fieldPaths:
          - spec.endpointAccess.publicCIDRs.0
