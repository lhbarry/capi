# CAPA EKS workload cluster — applied ONLY via Flux (aws-eks-clusters → Kind → CAPA → AWS).
# Generated from: clusterctl generate cluster --infrastructure aws --flavor eks
# Lab cost: 2 AZs / 2 NATs (EKS minimum AZs).
#
# WA substrate hardens (dev — do not enable Flux resources until ready to create AWS):
#   logging, endpointAccess, encryptionConfig (CMK), tags, no SSH, OIDC for IRSA later.
# Prerequisites when applying: deploy aws_eks/kms first; set PUBLIC_API_CIDR in kustomization.
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: capi-eks-1
  namespace: default
  labels:
    capa.lab/path: aws-eks
    capa.lab/cost-center: scke-lab
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
      - 192.168.0.0/16
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta2
    kind: AWSManagedControlPlane
    name: capi-eks-1-control-plane
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
    kind: AWSManagedCluster
    name: capi-eks-1
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: AWSManagedCluster
metadata:
  name: capi-eks-1
  namespace: default
spec: {}
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: AWSManagedControlPlane
metadata:
  name: capi-eks-1-control-plane
  namespace: default
spec:
  region: PLACEHOLDER_AWS_REGION
  version: v1.34.1
  # Bastion SSH: empty string = do not attach a key (prefer SSM on nodes when live).
  sshKeyName: ""
  bastion:
    enabled: false
  # OIDC provider for future IRSA / Pod Identity work.
  associateOIDCProvider: true
  # Lab: private + public with CIDR allowlist (Kind mgmt is outside VPC).
  # Prod target: private-only once management is in-VPC / VPN.
  endpointAccess:
    private: true
    public: true
    publicCIDRs:
    - PLACEHOLDER_PUBLIC_API_CIDR
  # Control-plane logs → CloudWatch (all five).
  logging:
    apiServer: true
    audit: true
    authenticator: true
    controllerManager: true
    scheduler: true
  # Secrets encryption at rest. Deploy aws_eks/kms CFN before cluster create.
  # Alias matches CAPA controllers-eks KMS grant condition (alias/cluster-api-provider-aws-*).
  encryptionConfig:
    provider: alias/cluster-api-provider-aws-eks-secrets
    resources:
    - secrets
  additionalTags:
    Project: scke
    Environment: lab
    Workload: capi-eks-1
    ManagedBy: capa
    CostCenter: scke-lab
  network:
    vpc:
      # EKS requires subnets in ≥2 AZs. Lab cost: 2 AZs ⇒ 2 NATs (not 3).
      availabilityZoneUsageLimit: 2
      availabilityZoneSelection: Ordered
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: capi-eks-1-md-0
  namespace: default
spec:
  clusterName: capi-eks-1
  replicas: 1
  selector:
    matchLabels: null
  template:
    spec:
      version: v1.34.1
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
          kind: NodeadmConfigTemplate
          name: capi-eks-1-md-0
      clusterName: capi-eks-1
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: AWSMachineTemplate
        # New name required: AWSMachineTemplate.spec is immutable
        name: capi-eks-1-md-0-al2023
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: AWSMachineTemplate
metadata:
  name: capi-eks-1-md-0-al2023
  namespace: default
spec:
  template:
    spec:
      ami:
        # EKS 1.34 has no AL2 optimized AMI; use AL2023 SSM lookup
        eksLookupType: AmazonLinux2023
      iamInstanceProfile: nodes.cluster-api-provider-aws.sigs.k8s.io
      instanceType: t3.large
      # No standing SSH — use SSM Session Manager when nodes exist (node role has SSM policy).
      sshKeyName: ""
      publicIP: false
      # AL2023 + CAPA: required when not using secrets-manager bootstrap path.
      cloudInit:
        insecureSkipSecretsManager: true
      additionalTags:
        Project: scke
        Environment: lab
        Workload: capi-eks-1
        ManagedBy: capa
        CostCenter: scke-lab
        Role: worker
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: NodeadmConfigTemplate
metadata:
  name: capi-eks-1-md-0
  namespace: default
spec:
  template:
    spec: {}
