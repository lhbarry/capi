AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Lab CMK for EKS secrets encryption (CAPA encryptionConfig).
  Alias alias/cluster-api-provider-aws-eks-secrets matches controllers-eks
  KMS grant condition (alias/cluster-api-provider-aws-*).
  DEV: template only until you choose to deploy; not applied by Flux.

Parameters:
  KeyAliasName:
    Type: String
    Default: alias/cluster-api-provider-aws-eks-secrets
    Description: Must stay under alias/cluster-api-provider-aws-* for CAPA IAM grants.

Resources:
  EKSSecretsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: CAPA EKS secrets encryption (scke lab)
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableRootAccountAdmin
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"
          - Sid: AllowEKSService
            Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
              - kms:CreateGrant
            Resource: "*"
            Condition:
              StringEquals:
                kms:CallerAccount: !Ref AWS::AccountId
          - Sid: AllowEKSClusterRoleViaService
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:role/eks-controlplane.cluster-api-provider-aws.sigs.k8s.io
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
              - kms:CreateGrant
            Resource: "*"
      Tags:
        - Key: Project
          Value: scke
        - Key: Environment
          Value: lab
        - Key: ManagedBy
          Value: cloudformation
        - Key: CostCenter
          Value: scke-lab
        - Key: Purpose
          Value: eks-secrets-encryption

  EKSSecretsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Ref KeyAliasName
      TargetKeyId: !Ref EKSSecretsKey

Outputs:
  KeyId:
    Description: KMS key ID
    Value: !Ref EKSSecretsKey
  KeyArn:
    Description: KMS key ARN (optional CAPA provider value)
    Value: !GetAtt EKSSecretsKey.Arn
  KeyAlias:
    Description: Alias referenced by AWSManagedControlPlane.spec.encryptionConfig.provider
    Value: !Ref KeyAliasName
